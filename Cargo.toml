[package]
name = "exile-extdb3"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LGPL-3.0-only"
publish = false

[lib]
name = "extDB3_x64"
crate-type = ["cdylib", "rlib"]

[features]
synthetic-bench = []
profile-requests = []
"arma-2.22-no-escape" = []

[[bench]]
name = "synthetic"
harness = false
required-features = ["synthetic-bench"]

[dependencies]
mysql_async = { version = "=0.37.1", default-features = false, features = ["default-rustls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
chrono = "0.4"
md-5 = "=0.10.6"
getrandom = "=0.2.17"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1

