services:
  mysql9:
    image: mysql:9.7.2
    container_name: exile-extdb3-mysql97-test
    environment:
      MYSQL_ROOT_PASSWORD: extdb_root_test_only
      MYSQL_DATABASE: extdb_test
      MYSQL_USER: extdb_test
      MYSQL_PASSWORD: extdb_test_only
    ports:
      - "127.0.0.1:33307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./certs:/etc/mysql/certs:ro
      - ./init.sql:/docker-entrypoint-initdb.d/01-extdb3-test.sql:ro
    command:
      - mysqld
      - --require-secure-transport=ON
      - --ssl-ca=/etc/mysql/certs/ca.pem
      - --ssl-cert=/etc/mysql/certs/server.pem
      - --ssl-key=/etc/mysql/certs/server-key.pem
      - --socket=/var/run/mysqld/extdb3-test.sock
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--user=root", "--password=extdb_root_test_only"]
      interval: 2s
      timeout: 3s
      retries: 40
volumes:
  mysql_data:
