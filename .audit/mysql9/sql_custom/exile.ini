SQL2_1 = UPDATE territory t SET t.moderators = (SELECT CONCAT(CONCAT('["',c.leader_uid),'"]') FROM clan c WHERE c.id = ?) WHERE t.id = ?
SQL3_1 = UPDATE territory t SET t.build_rights = (SELECT CONCAT(CONCAT('[',GROUP_CONCAT( CONCAT(CONCAT('"',x.uid)),'"')),']') FROM (SELECT a.uid FROM account a  WHERE a.clan_id = ? LIMIT 30) x) WHERE t.id = ?

