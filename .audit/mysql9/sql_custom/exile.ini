;; NER Units Groups and Deployment
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[createNERGroup]
SQL1_1 = INSERT INTO ner_unit_group_templates SET owner_uid = ?, clan_id = ?, name = ?, entries = ?, updated_by_uid = ?
SQL1_INPUTS = 1,2,3,4,1
Return InsertID = true

[readNERGroups]
SQL1_1 = SELECT g.id, g.owner_uid, g.clan_id, g.name, g.entries, DATE_FORMAT(g.updated_at, '%Y-%m-%d %H:%i:%s'), IFNULL(author.name, 'Unknown'), IFNULL(updater.name, 'Unknown') FROM ner_unit_group_templates g LEFT JOIN account author ON author.uid = g.owner_uid LEFT JOIN account updater ON updater.uid = g.updated_by_uid WHERE g.owner_uid = ? OR (g.clan_id = ? AND g.clan_id >= 0) ORDER BY g.updated_at DESC, g.id DESC
SQL1_INPUTS = 1,2
OUTPUT = 1,2-STRING,3,4-STRING,5,6-STRING,7-STRING,8-STRING

[updateNERGroup]
SQL1_1 = UPDATE ner_unit_group_templates SET name = ?, entries = ?, updated_by_uid = ?, updated_at = CURRENT_TIMESTAMP WHERE id = ? AND (owner_uid = ? OR (clan_id = ? AND clan_id >= 0))
SQL1_INPUTS = 4,5,2,1,2,3

[deleteNERGroup]
SQL1_1 = DELETE FROM ner_unit_group_templates WHERE id = ? AND (owner_uid = ? OR (clan_id = ? AND clan_id >= 0))
SQL1_INPUTS = 1,2,3

[createNERDeployment]
SQL1_1 = INSERT INTO ner_group_deployments SET owner_uid = ?, clan_id = ?, plan = ?, destination = ?, delivery_type = ?, min_gap_sec = ?, max_gap_sec = ?, status = ?
SQL1_INPUTS = 1,2,3,4,5,6,7,8
Return InsertID = true

[readNERDeployments]
SQL1_1 = SELECT id, owner_uid, clan_id, plan, destination, delivery_type, status, DATE_FORMAT(created_at, '%Y-%m-%d %H:%i:%s'), DATE_FORMAT(updated_at, '%Y-%m-%d %H:%i:%s') FROM ner_group_deployments WHERE owner_uid = ? OR (clan_id = ? AND clan_id >= 0) ORDER BY created_at DESC, id DESC LIMIT 100
SQL1_INPUTS = 1,2
OUTPUT = 1,2-STRING,3,4,5,6-STRING,7-STRING,8-STRING,9-STRING

[updateNERDeploymentStatus]
SQL1_1 = UPDATE ner_group_deployments SET status = ?, updated_at = CURRENT_TIMESTAMP WHERE id = ? AND (owner_uid = ? OR (clan_id = ? AND clan_id >= 0))
SQL1_INPUTS = 1,2,3,4
