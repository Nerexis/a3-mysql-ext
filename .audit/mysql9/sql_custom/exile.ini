SQL4_1 = REPLACE INTO variables (`obj_id`, `key`, `type_name`, `value`, `date_updated`) SELECT ?, ?, ?, ?, CURRENT_TIMESTAMP FROM DUAL WHERE ? <> ''
SQL5_1 = REPLACE INTO variables (`obj_id`, `key`, `type_name`, `value`, `date_updated`) SELECT ?, ?, ?, ?, CURRENT_TIMESTAMP FROM DUAL WHERE ? <> ''
SQL6_1 = REPLACE INTO variables (`obj_id`, `key`, `type_name`, `value`, `date_updated`) SELECT ?, ?, ?, ?, CURRENT_TIMESTAMP FROM DUAL WHERE ? <> ''
SQL7_1 = REPLACE INTO variables (`obj_id`, `key`, `type_name`, `value`, `date_updated`) SELECT ?, ?, ?, ?, CURRENT_TIMESTAMP FROM DUAL WHERE ? <> ''
SQL8_1 = REPLACE INTO variables (`obj_id`, `key`, `type_name`, `value`, `date_updated`) SELECT ?, ?, ?, ?, CURRENT_TIMESTAMP FROM DUAL WHERE ? <> ''

