SQL1_INPUTS = 1,2
OUTPUT = 1

[loadTerritory]
SQL1_1 = SELECT t.id, t.owner_uid, t.name, t.position_x, t.position_y, t.position_z, t.radius, t.level, t.flag_texture, t.flag_stolen, t.flag_stolen_by_uid, t.last_paid_at, t.build_rights, t.moderators, t.deleted_at, ((SELECT COUNT(*) FROM construction c WHERE c.territory_id = t.id AND c.deleted_at IS NULL AND c.damage < 1) + (SELECT COUNT(*) FROM container c WHERE c.territory_id = t.id AND c.deleted_at IS NULL)) as constructions_and_containers_count, DATEDIFF(NOW(), t.created_at) as days_since_created, IFNULL(a.next_raid_at, (SELECT next_raid_at FROM account aa WHERE aa.clan_id = a.clan_id and next_raid_at is not null ORDER BY next_raid_at desc LIMIT 1)) as next_raid_at, IFNULL(a.clan_id,-1) as clan_id, color.color_name, brush.brush_name, a.name as account_name, ac.name as clan_name, CASE WHEN (now() >= a.next_raid_at OR (SELECT COUNT(*) FROM account aa WHERE aa.clan_id = a.clan_id AND a.clan_id is not null AND now() >= aa.next_raid_at) > 0) THEN 'true' ELSE 'false' END as isRaidTime, DATEDIFF(NOW(), t.last_ownership_change), t.is_strategic FROM territory t JOIN account a ON a.uid = t.owner_uid LEFT JOIN clan ac ON ac.id = a.clan_id LEFT JOIN account al ON al.uid = ac.leader_uid LEFT JOIN color ON ac.territory_color = color.id_color LEFT JOIN brush ON ac.territory_brush = brush.id_brush WHERE t.id = ?

SQL1_INPUTS = 1
OUTPUT = 1,2-STRING,3-STRING,4,5,6,7,8,9-STRING,10,11-STRING,12,13,14,15,16,17-STRING,18-STRING,19,20-STRING,21-STRING,22-STRING,23-STRING,24,25,26

