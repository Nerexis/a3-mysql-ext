[distributeTerritoryRewards]
SQL1_1 = UPDATE account ac3 INNER JOIN ( SELECT ac.uid, (( (SELECT COUNT(*) FROM territory t WHERE INSTR(t.build_rights,ac.uid)) * (SELECT (25 * (SELECT TIMESTAMPDIFF(MINUTE,p.last_rewards_distribution,NOW()) FROM exileborders_params p))) ) / (SELECT COUNT(*) FROM account ac2 WHERE ac2.clan_id IS NOT NULL AND ac2.clan_id = ac.clan_id)) as reward FROM account ac ) as r ON r.uid = ac3.uid SET ac3.locker = ac3.locker + 500 + r.reward WHERE ac3.clan_id IS NOT NULL;
SQL2_1 = UPDATE account ac3 INNER JOIN ( SELECT ac.uid, (( (SELECT COUNT(*) FROM territory t WHERE INSTR(t.build_rights,ac.uid)) * (SELECT (25 * (SELECT TIMESTAMPDIFF(MINUTE,p.last_rewards_distribution,NOW()) FROM exileborders_params p))) )) as reward FROM account ac ) as r ON r.uid = ac3.uid SET ac3.locker = ac3.locker + 500 + r.reward WHERE ac3.clan_id IS NULL;
SQL3_1 = UPDATE exileborders_params SET last_rewards_distribution = NOW();

