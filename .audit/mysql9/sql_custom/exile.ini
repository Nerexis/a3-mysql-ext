[Default]

Version = 1

Strip Chars = "\/\|;{}<>\'"
;; List of characters to strip out

Strip Chars Mode = 1
;; 0 = Strip Bad Chars, 1 = Strip + Log Bad Chars, 2 = Return Error & Log Bad Chars
;;     Note: Logging on works when sending data to database.

Input SQF Parser = false
;; Expermential
;;   If enabled will use SQF Array Parser instead of : seperator for values
;;   i.e   0:SQL:UpdatePlayer:["Joe",[1,2,0],0.22333,"PlayerBackpack",-3]
;;   Advantage is that you don't need to strip : seperator from user inputted values

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Account related queries
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[isKnownAccount]
SQL1_1 = SELECT CASE WHEN EXISTS(SELECT uid FROM account WHERE uid = ?) THEN 'true' ELSE 'false' END

SQL1_INPUTS = 1
OUTPUT = 1

[createAccount]
SQL1_1 = INSERT INTO account SET uid = ?, name = ?

SQL1_INPUTS = 1,2

[startAccountSession]
SQL1_1 = UPDATE account SET name = ?, last_connect_at = NOW(), total_connections = total_connections + 1 WHERE uid = ?

SQL1_INPUTS = 2,1

[endAccountSession]
SQL1_1 = UPDATE account SET last_disconnect_at = NOW() WHERE uid = ?

SQL1_INPUTS = 1

[getAccountStats]
SQL1_1 = SELECT score, kills, deaths, clan_id, locker FROM account WHERE uid = ?

SQL1_INPUTS = 1
OUTPUT = 1,2,3,4,5

[addAccountKill]
SQL1_1 = UPDATE account SET kills = kills + 1 WHERE uid = ?

SQL1_INPUTS = 1

[addAccountKillPVP]
SQL1_1 = UPDATE account SET pvp_kills = pvp_kills + 1 WHERE uid = ?

SQL1_INPUTS = 1

[addAccountDeath]
SQL1_1 = UPDATE account SET deaths = deaths + 1 WHERE uid = ?

SQL1_INPUTS = 1

[addAccountDeathPVP]
SQL1_1 = UPDATE account SET pvp_deaths = pvp_deaths + 1 WHERE uid = ?

SQL1_INPUTS = 1

[getAccountScore]
SQL1_1 = SELECT score FROM account WHERE uid = ?

SQL1_INPUTS = 1
OUTPUT = 1

[setAccountScore]
SQL1_1 = UPDATE account SET score = ? WHERE uid = ?

SQL1_INPUTS = 1,2

[modifyAccountScore]
SQL1_1 = UPDATE account SET score = score + ? WHERE uid = ?

SQL1_INPUTS = 1,2

[updateLocker]
SQL1_1 = UPDATE account SET locker = ? WHERE uid = ?

SQL1_INPUTS = 1,2

[getLocker]
SQL1_1 = SELECT locker FROM account WHERE uid = ?

SQL1_INPUTS = 1
OUTPUT = 1

[getLockerBalanceExact]
SQL1_1 = SELECT locker FROM account WHERE uid = ?

SQL1_INPUTS = 1
OUTPUT = 1-STRING

[claimDailyActiveBonus]
SQL1_1 = INSERT IGNORE INTO daily_active_bonus_claims (claim_key, account_uid, bonus_date, amount, total_money, percentage) SELECT CONCAT(?, '_', CURRENT_DATE), ?, CURRENT_DATE, GREATEST(FLOOR(total_money * ? / 100), ?), total_money, ? FROM (SELECT COALESCE((SELECT SUM(locker) FROM account), 0) + COALESCE((SELECT SUM(bank_balance) FROM clan), 0) + COALESCE((SELECT SUM(money) FROM container WHERE deleted_at IS NULL), 0) + COALESCE((SELECT SUM(money) FROM vehicle WHERE deleted_at IS NULL AND destroyed_at IS NULL), 0) AS total_money) totals

SQL1_INPUTS = 1,2,3,4,5

SQL2_1 = UPDATE account a INNER JOIN daily_active_bonus_claims c ON c.account_uid = a.uid AND c.claim_key = CONCAT(?, '_', CURRENT_DATE) SET a.locker = a.locker + c.amount, c.payout_applied = 1, c.claimed_at = CURRENT_TIMESTAMP WHERE a.uid = ? AND c.payout_applied = 0 AND c.amount > 0

SQL2_INPUTS = 1,2

SQL3_1 = SELECT ROW_COUNT(), c.amount, c.total_money FROM daily_active_bonus_claims c WHERE c.account_uid = ? AND c.claim_key = CONCAT(?, '_', CURRENT_DATE)

SQL3_INPUTS = 1,2
OUTPUT = 1,2,3

[claimDailyActiveBonusTest]
SQL1_1 = INSERT INTO daily_active_bonus_claims (claim_key, account_uid, bonus_date, amount, total_money, percentage) SELECT ?, ?, CURRENT_DATE, GREATEST(FLOOR(total_money * ? / 100), ?), total_money, ? FROM (SELECT COALESCE((SELECT SUM(locker) FROM account), 0) + COALESCE((SELECT SUM(bank_balance) FROM clan), 0) + COALESCE((SELECT SUM(money) FROM container WHERE deleted_at IS NULL), 0) + COALESCE((SELECT SUM(money) FROM vehicle WHERE deleted_at IS NULL AND destroyed_at IS NULL), 0) AS total_money) totals

SQL1_INPUTS = 1,2,3,4,5

SQL2_1 = UPDATE account a INNER JOIN daily_active_bonus_claims c ON c.account_uid = a.uid AND c.claim_key = ? SET a.locker = a.locker + c.amount, c.payout_applied = 1, c.claimed_at = CURRENT_TIMESTAMP WHERE a.uid = ? AND c.payout_applied = 0 AND c.amount > 0

SQL2_INPUTS = 1,2

SQL3_1 = SELECT ROW_COUNT(), c.amount, c.total_money FROM daily_active_bonus_claims c WHERE c.claim_key = ? AND c.account_uid = ?

SQL3_INPUTS = 1,2
OUTPUT = 1,2,3

[canBuyVehicle]
SQL1_1 = SELECT CASE WHEN EXISTS(SELECT true FROM account WHERE uid = ? AND now() > DATE_ADD(last_time_bought_veh, INTERVAL 3 MINUTE)) THEN 'true' ELSE 'false' END

SQL1_INPUTS = 1
OUTPUT = 1

[updateLastTimeBoughtVeh]
SQL1_1 = UPDATE account SET last_time_bought_veh = CURRENT_TIMESTAMP WHERE uid = ?

SQL1_INPUTS = 1

[updateLastRaidDeath]
SQL1_1 = UPDATE account SET last_raid_death = CURRENT_TIMESTAMP WHERE uid = ?

SQL1_INPUTS = 1

[isLastRaidDeathCooldownExpired]
SQL1_1 = SELECT CASE WHEN EXISTS(SELECT true FROM account WHERE uid = ? AND now() > DATE_ADD(last_raid_Death, INTERVAL ? MINUTE)) THEN 'true' ELSE 'false' END
;; uid, interval
SQL1_INPUTS = 1,2
OUTPUT = 1

[getServerTimeWhenRaidDeathCooldownIsExpired]
SQL1_1 = SELECT TIMESTAMPDIFF(SECOND, x.server_start_time, DATE_ADD(a.last_raid_death,INTERVAL ? MINUTE)) as can_respawn_at_serverTime FROM (SELECT DATE_SUB(now(), INTERVAL ? SECOND) as server_start_time FROM DUAL ) x, account a WHERE a.uid = ?
;; -- interval, serverTime, uid
SQL1_INPUTS = 1,2,3
OUTPUT = 1

; Deploy order cooldown
[canOrderDeploy]
SQL1_1 = SELECT CASE WHEN EXISTS(SELECT true FROM account WHERE uid = ? AND NOW() > DATE_ADD(IFNULL(last_deploy_order_at, '1970-01-01'), INTERVAL ? MINUTE)) THEN 'true' ELSE 'false' END
SQL1_INPUTS = 1,2
OUTPUT = 1

[updateLastDeployOrderTime]
SQL1_1 = UPDATE account SET last_deploy_order_at = CURRENT_TIMESTAMP WHERE uid = ?
SQL1_INPUTS = 1

[getServerTimeWhenDeployOrderCooldownIsExpired]
SQL1_1 = SELECT TIMESTAMPDIFF(SECOND, x.server_start_time, DATE_ADD(IFNULL(a.last_deploy_order_at,'1970-01-01'),INTERVAL ? MINUTE)) as available_at_serverTime FROM (SELECT DATE_SUB(now(), INTERVAL ? SECOND) as server_start_time FROM DUAL ) x, account a WHERE a.uid = ?
;; -- interval, serverTime, uid
SQL1_INPUTS = 1,2,3
OUTPUT = 1

