; Marks for deletion containers outside territories that were not accessed within ? days
[markDeleteOldContainers]
SQL1_1 = UPDATE container c SET c.deleted_at = NOW() WHERE c.last_updated_at < DATE_SUB(NOW(), INTERVAL ? DAY) AND (c.territory_id IS NULL OR NOT EXISTS (SELECT 1 FROM territory t WHERE t.id = c.territory_id)) IS NULL AND c.deleted_at IS NULL

SQL1_INPUTS = 1

; Removes containers outside territories that were not accessed within ? days
[deleteOldContainers]
SQL1_1 = DELETE FROM container WHERE deleted_at < DATE_SUB(NOW(), INTERVAL ? DAY) AND territory_id IS NULL

SQL1_INPUTS = 1

; Marks contructions outside territories deleted after ? days  WHERE spawned_at < DATE_SUB(NOW(), INTERVAL ? DAY) AND territory_id IS NULL AND deleted_at IS NULL
[markDeleteOldConstructions]
SQL1_1 = UPDATE construction c SET c.deleted_at = NOW() WHERE c.spawned_at < DATE_SUB(NOW(), INTERVAL ? DAY) AND (c.territory_id IS NULL OR NOT EXISTS (SELECT 1 FROM territory t WHERE t.id = c.territory_id)) AND c.deleted_at IS NULL

SQL1_INPUTS = 1

; Removes contructions outside territories after ? days
[deleteOldConstructions]
SQL1_1 = DELETE FROM construction WHERE deleted_at < DATE_SUB(NOW(), INTERVAL ? DAY) AND territory_id IS NULL

SQL1_INPUTS = 1

; Marks for deletion vehicles that were not used within ? days
[markDeleteOldVehicles]
; SQL1_1 = UPDATE vehicle SET deleted_at = NOW() WHERE last_updated_at < DATE_SUB(NOW(), INTERVAL ? DAY) AND deleted_at IS NULL
; SQL1_1 = UPDATE vehicle v LEFT OUTER JOIN territory t on v.account_uid = t.owner_uid SET v.deleted_at = NOW() WHERE v.last_updated_at < DATE_SUB(NOW(), INTERVAL ? DAY) AND v.deleted_at IS NULL AND (sqrt( POW(t.position_x-v.position_x,2) + POW(t.position_y-v.position_y,2) ) > t.radius OR  t.owner_uid IS NULL)
; SQL1_1 = UPDATE vehicle v LEFT OUTER JOIN territory t on v.account_uid = t.owner_uid SET v.deleted_at = NOW() WHERE v.last_get_in < DATE_SUB(NOW(), INTERVAL ? DAY) AND v.deleted_at IS NULL AND (sqrt( POW(t.position_x-v.position_x,2) + POW(t.position_y-v.position_y,2) ) > t.radius OR  t.owner_uid IS NULL)
; below wont delete vehicles if close to any territory
; SQL1_1 = UPDATE vehicle v SET v.deleted_at = NOW() WHERE v.last_get_in < DATE_SUB(NOW(), INTERVAL ? DAY) AND v.deleted_at IS NULL AND EXISTS (SELECT 1 FROM territory t WHERE sqrt( POW(t.position_x-v.position_x,2) + POW(t.position_y-v.position_y,2) ) > t.radius OR  t.owner_uid IS NULL)
SQL1_1 = UPDATE vehicle v SET v.deleted_at = NOW() WHERE v.last_get_in < DATE_SUB(NOW(), INTERVAL ? DAY) AND v.deleted_at IS NULL AND NOT EXISTS (SELECT 1 FROM territory t WHERE sqrt( POW(t.position_x-v.position_x,2) + POW(t.position_y-v.position_y,2) ) < t.radius )

SQL1_INPUTS = 1

; Removes vehicles that were not used within ? days
[deleteOldVehicles]
SQL1_1 = DELETE FROM vehicle WHERE deleted_at < DATE_SUB(NOW(), INTERVAL ? DAY)

SQL1_INPUTS = 1

; Marks territories (and all containers/constructions) that were not paid within ? days as deleted
[markDeleteUnpaidTerritories]
SQL1_1 = UPDATE territory SET deleted_at = NOW() WHERE last_paid_at < DATE_SUB(NOW(), INTERVAL ? + 1 DAY) AND deleted_at IS NULL AND is_strategic = 0
SQL2_1 = UPDATE construction SET deleted_at = NOW() WHERE EXISTS (SELECT deleted_at FROM territory WHERE territory.id = construction.territory_id AND territory.deleted_at IS NOT NULL AND territory.is_strategic = 0)
SQL3_1 = UPDATE container SET deleted_at = NOW() WHERE EXISTS (SELECT deleted_at FROM territory WHERE territory.id = container.territory_id AND territory.deleted_at IS NOT NULL AND territory.is_strategic = 0)

SQL1_INPUTS = 1


; Removes territories (and all containers/constructions) that were not paid within ? days
