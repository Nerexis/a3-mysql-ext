SQL1_INPUTS = 1,1

[getNextRaidDateByFlagOwnerUID]
SQL1_1 = SELECT date_add((DATE(DATE_ADD(NOW(), INTERVAL x.days_to_add DAY))),INTERVAL 20 HOUR) FROM (SELECT CASE WHEN WEEKDAY(NOW()) = 0 THEN 2 WHEN WEEKDAY(NOW()) = 1 THEN 5 WHEN WEEKDAY(NOW()) = 2 THEN 4 WHEN WEEKDAY(NOW()) = 3 THEN 3 WHEN WEEKDAY(NOW()) = 4 THEN 2 WHEN WEEKDAY(NOW()) = 5 THEN 4 WHEN WEEKDAY(NOW()) = 6 THEN 3 END as days_to_add FROM DUAL) x

SQL1_INPUTS = 0

OUTPUT = 1-STRING

[getPostponedNextRaidDateByFlagOwnerUID]
SQL1_1 = SELECT date_add((DATE(DATE_ADD(a.next_raid_at, INTERVAL x.days_to_add DAY))),INTERVAL 20 HOUR) FROM (SELECT CASE WHEN WEEKDAY(a.next_raid_at) = 0 THEN 2 WHEN WEEKDAY(a.next_raid_at) = 1 THEN 1 WHEN WEEKDAY(a.next_raid_at) = 2 THEN 4 WHEN WEEKDAY(a.next_raid_at) = 3 THEN 3 WHEN WEEKDAY(a.next_raid_at) = 4 THEN 2 WHEN WEEKDAY(a.next_raid_at) = 5 THEN 4 WHEN WEEKDAY(a.next_raid_at) = 6 THEN 3 END as days_to_add FROM account a WHERE a.uid = ?) x JOIN account a ON a.uid = ?

SQL1_INPUTS = 1,1
OUTPUT = 1-STRING

[isRaidPostponeAllowedForPlayerOrHisClan]
SQL1_1 = SELECT CASE WHEN DATE(NOW()) < DATE(x.next_raid_at) then 'true' else 'false' end FROM (SELECT IFNULL(ac.next_raid_at,a.next_raid_at) as next_raid_at FROM account a LEFT JOIN account ac ON ac.clan_id = a.clan_id AND ac.next_raid_at IS NOT NULL WHERE a.uid = ? AND (a.next_raid_at IS NOT NULL AND NOW() <= a.next_raid_at OR (ac.next_raid_at IS NOT NULL AND NOW() <= ac.next_raid_at) ) ) x

SQL1_INPUTS = 1
OUTPUT = 1

[hasPlayerOrHisClanARaid]
SQL1_1 = SELECT case when exists (SELECT 1 FROM account a LEFT JOIN account ac ON ac.clan_id = a.clan_id AND ac.next_raid_at IS NOT NULL WHERE a.uid = ? AND (a.next_raid_at IS NOT NULL AND NOW() <= a.next_raid_at OR (ac.next_raid_at IS NOT NULL AND NOW() <= ac.next_raid_at) ) ) then 'true' else 'false' end

SQL1_INPUTS = 1
OUTPUT = 1

[isTerritoryInRaidTime]
SQL1_1 = SELECT  CASE  WHEN ( DAY(ao.next_raid_at) = DAY(NOW()) && HOUR(ao.next_raid_at) = HOUR(NOW()) && MONTH(ao.next_raid_at) = MONTH(NOW()) && YEAR(ao.next_raid_at) = YEAR(NOW())) THEN 'true' ELSE 'false' END AS isRaidTime FROM territory t  JOIN account ao on t.owner_uid = ao.uid LEFT JOIN clan co ON co.id = ao.clan_id JOIN account al ON (co.leader_uid is not null AND al.uid = co.leader_uid) OR (co.leader_uid is null and ao.uid = al.uid) WHERE t.id = ?

SQL1_INPUTS = 1

OUTPUT = 1

