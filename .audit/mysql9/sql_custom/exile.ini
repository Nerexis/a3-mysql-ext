SQL1_1 = INSERT INTO loadout_private SET account_uid = ?, name = ?, items = ?, loadout_string = ?, picture_path = ?
SQL1_INPUTS = 1,2,3,4,5

[createClanLoadout]
SQL1_1 = INSERT INTO loadout_clan SET clan_id = ?, name = ?, items = ?, loadout_string = ?, picture_path = ?
SQL1_INPUTS = 1,2,3,4,5

[readPrivateLoadouts]
SQL1_1 = SELECT id, name, items, loadout_string, picture_path FROM loadout_private WHERE account_uid = ?
SQL1_INPUTS = 1
OUTPUT = 1,2-STRING,3,4,5-STRING

[readClanLoadouts]
SQL1_1 = SELECT id, name, items, loadout_string, picture_path FROM loadout_clan WHERE clan_id = ?
SQL1_INPUTS = 1
OUTPUT = 1,2-STRING,3,4,5-STRING

[readPrivateLoadoutByIDAndAccountID]
SQL1_1 = SELECT id, name, items, loadout_string FROM loadout_private WHERE id = ? AND account_uid = ?
SQL1_INPUTS = 1,2
OUTPUT = 1,2-STRING,3,4

[readClanLoadoutByIDAndClanID]
SQL1_1 = SELECT id, name, items, loadout_string FROM loadout_clan WHERE id = ? AND clan_id = ?
SQL1_INPUTS = 1,2
OUTPUT = 1,2-STRING,3,4

[deletePrivateLoadout]
SQL1_1 = DELETE FROM loadout_private WHERE account_uid = ? AND id = ?
SQL1_INPUTS = 1,2

[deleteClanLoadout]
SQL1_1 = DELETE FROM loadout_clan WHERE clan_id = ? AND id = ?
SQL1_INPUTS = 1,2

[doesPrivateLoadoutExist]
SQL1_1 = SELECT CASE WHEN COUNT(*)>0 THEN true ELSE false END FROM loadout_private WHERE account_uid = ? AND name = ?
SQL1_INPUTS = 1,2

[doesClanLoadoutExist]
