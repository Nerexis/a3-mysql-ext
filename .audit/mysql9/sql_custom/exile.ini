;; Units by Nerexis
[insertUnit]
SQL1_1 = INSERT INTO units SET owner_uid = ?, clan_id = ?, classname = ?, name = ?, loadout = ?, position_x = ?, position_y = ?, position_z = ?, combat_mode = ?, spawned_at = CURRENT_TIMESTAMP, last_updated_at = CURRENT_TIMESTAMP

SQL1_INPUTS = 1,2-NULL,3,4,5,6,7,8,9
Return InsertID = true

[deleteUnit]
SQL1_1 = UPDATE units SET deleted_at = CURRENT_TIMESTAMP WHERE id = ?

SQL1_INPUTS = 1

[loadUnitsIdPage]
SQL1_1 = SELECT u.id, u.classname FROM units u LEFT JOIN construction_unit_storage c ON u.id = c.unit_id WHERE u.deleted_at IS NULL AND c.unit_id IS NULL LIMIT ?,?

SQL1_INPUTS = 1,2
OUTPUT = 1,2-STRING

[loadUnitsPage]
SQL1_1 = SELECT u.id, u.owner_uid, IFNULL(u.clan_id,-1), u.classname, u.name, REPLACE(u.loadout,'"',"'"), u.position_x, u.position_y, u.position_z, u.combat_mode, u.combat_behaviour, u.money, IFNULL(cus.construction_id,-1), IFNULL(cus_c.class,''), IFNULL(u.vehicle_id,-1), REPLACE(IFNULL(u.assigned_veh_role,"['']"),'"',"'"), IFNULL(u.group_id,-1), u.damage FROM units u LEFT JOIN construction_unit_storage cus ON cus.unit_id = u.id LEFT JOIN construction cus_c ON cus_c.id = cus.construction_id WHERE u.deleted_at IS NULL AND cus.unit_id IS NULL LIMIT ?,?

SQL1_INPUTS = 1,2
OUTPUT = 1,2-STRING,3-NULL,4-STRING,5-STRING,6,7,8,9,10-STRING,11-STRING,12,13-NULL,14-STRING,15-NULL,16-NULL,17-NULL,18

[readUnit]
SQL1_1 = SELECT u.id, u.owner_uid, IFNULL(u.clan_id,-1), u.classname, u.name, REPLACE(u.loadout,'"',"'"), u.position_x, u.position_y, u.position_z, u.combat_mode, u.combat_behaviour, u.money, IFNULL(cus.construction_id,-1), IFNULL(cus_c.class,''), IFNULL(u.vehicle_id,-1), REPLACE(IFNULL(u.assigned_veh_role,"['']"),'"',"'"), IFNULL(u.group_id,-1), u.damage FROM units u LEFT JOIN construction_unit_storage cus ON cus.unit_id = u.id LEFT JOIN construction cus_c ON cus_c.id = cus.construction_id WHERE u.id = ?

SQL1_INPUTS = 1
OUTPUT = 1,2-STRING,3-NULL,4-STRING,5-STRING,6,7,8,9,10-STRING,11-STRING,12,13-NULL,14-STRING,15-NULL,16-NULL,17-NULL,18

