[Default]
Version = 1
Strip Chars = ""
Strip Chars Mode = 0
Input SQF Parser = false

[echo]
SQL1_1 = SELECT ?, ?, NULL
SQL1_INPUTS = 1,2
OUTPUT = 1-STRING-add_escape_quotes,2,3-NULL

[raw]
SQL1_1 = SELECT ?
SQL1_INPUTS = 1
OUTPUT = 1

[nullDefault]
SQL1_1 = SELECT NULL

[large]
SQL1_1 = WITH RECURSIVE seq AS (SELECT 1 AS n UNION ALL SELECT n + 1 FROM seq WHERE n < 50) SELECT REPEAT('x', 200) FROM seq
OUTPUT = 1-STRING

[slow]
SQL1_1 = SELECT SLEEP(0.05), ?
SQL1_INPUTS = 1
OUTPUT = 1,2-STRING

[broken]
SQL1_1 = SELECT FROM

[multiStep]
SQL1_1 = SELECT ?
SQL1_INPUTS = 1
SQL2_1 = SELECT ?
SQL2_INPUTS = 2
OUTPUT = 1-STRING

[insert]
SQL1_1 = INSERT INTO probe_insert (name) VALUES (?)
SQL1_INPUTS = 1
Return InsertID = true

[date]
SQL1_1 = SELECT CAST('2026-10-10 13:14:15' AS DATETIME)
OUTPUT = 1

[bool]
SQL1_1 = SELECT ?, ?
SQL1_INPUTS = 1-BOOL,2-NULL
OUTPUT = 1-BOOL,2-NULL
